name: Publish Trakovo release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and build release
        run: |
          npm run lint
          npx tsc --noEmit
          npm run build

      - name: Verify release metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          if ($version -ne $package.version -and -not $version.StartsWith("$($package.version)-")) {
            throw "Git tag $($env:RELEASE_TAG) must match package.json version $($package.version) or use it as a pre-release base."
          }
          $notes = "RELEASE-NOTES-$($env:RELEASE_TAG).md"
          if ($version -eq $package.version) {
            $notes = "RELEASE-NOTES-v$version.md"
          }
          if (-not (Test-Path -LiteralPath $notes)) {
            throw "Missing $notes. Add release notes before creating the tag."
          }
          if (-not (Test-Path -LiteralPath '.next\BUILD_ID')) {
            throw 'The Next.js build did not produce .next/BUILD_ID.'
          }

      - name: Create cPanel artifacts
        shell: pwsh
        run: ./make-zip.ps1

      - name: Create Docker deployment bundle
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $root = Join-Path $pwd 'docker-release'
          if (Test-Path -LiteralPath $root) {
            Remove-Item -LiteralPath $root -Recurse -Force
          }
          New-Item -ItemType Directory -Path $root | Out-Null

          $items = @(
            'Dockerfile',
            '.dockerignore',
            'package.json',
            'package-lock.json',
            'next.config.js',
            'prisma',
            'database',
            'tools',
            'deploy',
            'docs/DEPLOYMENT-DOCKER.md'
          )
          foreach ($item in $items) {
            if (-not (Test-Path -LiteralPath $item)) {
              throw "Docker bundle item is missing: $item"
            }
            Copy-Item -LiteralPath $item -Destination $root -Recurse
          }

          $paths = @(Get-ChildItem -LiteralPath $root -Force | ForEach-Object { $_.FullName })
          Compress-Archive -Path $paths -DestinationPath "trakovo-docker-v$version.zip"

      - name: Resolve release asset names
        id: assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          "cpanel_version=$($package.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "docker_asset=trakovo-docker-v$version.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE-NOTES-${{ github.ref_name }}.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            trakovo-v${{ steps.assets.outputs.cpanel_version }}.zip
            next-bundle-v${{ steps.assets.outputs.cpanel_version }}.zip
            ${{ steps.assets.outputs.docker_asset }}
