name: Check Trakovo changes

on:
  pull_request:

permissions:
  contents: read

jobs:
  category-schema:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: disposable-schema-test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: node --test tests/fleet-category-schema.test.cjs
        env:
          TRAKOVO_SCHEMA_TEST: '1'
          TRAKOVO_SCHEMA_TEST_PASSWORD: disposable-schema-test
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - run: node --test tests/taxi-booking.test.cjs tests/special-occasions.test.cjs tests/update-safety.test.cjs tests/portal-connections.test.cjs
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          DB_HOST: '127.0.0.1'
          DB_PORT: '9'
      - name: Check cPanel packaging
        shell: pwsh
        run: ./tests/cpanel-packaging.test.ps1
